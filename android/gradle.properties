# Builds mais rápidos nesta máquina (16 núcleos / 30 GB de RAM).
# O Gradle passa a usar mais memória, todos os núcleos e cache de tarefas.
org.gradle.jvmargs=-Xmx10G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.workers.max=16
org.gradle.daemon=true

# O daemon do Kotlin também ganha memória para não virar gargalo.
kotlin.daemon.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
kotlin.incremental=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

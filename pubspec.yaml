name: stardew_guia
description: Enciclopédia offline de Stardew Valley em português do Brasil, com guia do iniciante, progresso e assistente de IA local.
publish_to: 'none'
version: 1.4.0+7

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.0
  # IA local (LLM no aparelho). Os pacotes devem ser atualizados juntos.
  flutter_edge_ai: ^2.5.0
  flutter_edge_ai_litertlm: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PixelifySans
      fonts:
        - asset: assets/fonts/PixelifySans.ttf
  assets:
    - assets/data/
    - assets/wiki/
    - assets/img/
